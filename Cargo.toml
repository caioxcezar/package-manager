[package]
name = "package-manager"
version = "1.12.7"
edition = "2021"

[dependencies]
adw = { version = "0.8.1", package = "libadwaita", features = ["v1_6"] }
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_10"] }
secstr = "0.5.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
flate2 = "1.0"
tar = "0.4"
rayon = "1.7.0"
regex = "1.7.3"
strum = "0.28.0"
strum_macros = "0.28.0"
async-channel = "2.3.1"
features = "0.10.0"
anyhow = "1.0.95"
rust-fuzzy-search = "0.1.1"
serde_json = "1.0.137"
zip = "8.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
alpm = "5.0.2"

[build-dependencies]
glib-build-tools = "0.21.0"
gtk = { version = "0.10.3", package = "gtk4" }
